# Example: OpenObserve Cloud Configuration
# OpenObserve Cloud uses SSO, so the operator connects with a service account.
# The service account needs a role with access to alerts, templates, destinations,
# functions, pipelines, dashboards and folders; without one every call returns 403.
apiVersion: v1
kind: Secret
metadata:
  name: o2-cloud-service-account
  namespace: o2operator
type: Opaque
stringData:
  username: your-service-account@sa.internal  # Service account email
  token: your-service-account-token           # Service account token (used as password in Basic Auth)
---
apiVersion: openobserve.ai/v1alpha1
kind: Config
metadata:
  name: openobserve-cloud
  namespace: o2operator
spec:
  endpoint: https://api.openobserve.ai
  organization: your-org-identifier  # Organization identifier (recommended; the display name also resolves)
  credentialsSecretRef:
    name: o2-cloud-service-account
    key: token  # Key="token" identifies this as a service account
  tlsVerify: true
