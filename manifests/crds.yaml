apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dashboards.openobserve.ai
spec:
  group: openobserve.ai
  names:
    kind: Dashboard
    listKind: DashboardList
    plural: dashboards
    singular: dashboard
    shortNames:
    - o2dash
    - o2dashboard
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - configRef
            - title
            - dashboard
            properties:
              configRef:
                type: object
                required:
                - name
                properties:
                  name:
                    type: string
                    description: Name of the OpenObserveConfig resource
                  namespace:
                    type: string
                    description: Namespace of the OpenObserveConfig resource (defaults to same namespace)
              title:
                type: string
                description: Dashboard title - must be unique within the organization and folder
              org:
                type: string
                default: "default"
                description: Organization name to create the dashboard in. If not specified, defaults to "default"
              folderName:
                type: string
                default: "default"
                description: Folder name for organizing dashboards. If not specified, defaults to "default". Will be auto-created if it doesn't exist.
              description:
                type: string
                description: Human-readable description of the dashboard
              dashboard:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                description: Complete dashboard definition including tabs, panels, queries, and visualizations. This is stored as raw JSON to support the complex dashboard structure.
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      type: integer
                      format: int64
              dashboardId:
                type: string
                description: Dashboard ID assigned by OpenObserve
              folderId:
                type: string
                description: Folder ID where the dashboard is stored
              organization:
                type: string
                description: Organization where the dashboard was created
              lastSyncTime:
                type: string
                format: date-time
                description: Timestamp of the last successful sync with OpenObserve
              observedGeneration:
                type: integer
                format: int64
                description: The generation of the most recently observed dashboard
              deletionRetryCount:
                type: integer
                description: Tracks the number of deletion attempts
    additionalPrinterColumns:
    - name: Title
      type: string
      jsonPath: .spec.title
      description: Dashboard title
    - name: Org
      type: string
      jsonPath: .spec.org
      description: Organization name
    - name: Folder
      type: string
      jsonPath: .spec.folderName
      description: Folder name
    - name: Ready
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
      description: Ready status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
      description: Age of the resource
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: destinations.openobserve.ai
spec:
  group: openobserve.ai
  names:
    kind: Destination
    listKind: DestinationList
    plural: destinations
    singular: destination
    shortNames:
    - o2dest
    - o2destination
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - configRef
            - name
            - type
            properties:
              configRef:
                type: object
                required:
                - name
                properties:
                  name:
                    type: string
                    description: Name of the OpenObserveConfig resource
                  namespace:
                    type: string
                    description: Namespace of the OpenObserveConfig resource (defaults to same namespace)
              name:
                type: string
                pattern: "^[a-zA-Z0-9_-]+$"
                description: Unique identifier for the destination
              org:
                type: string
                description: Organization name to create the destination in. If not specified, uses the organization from ConfigRef.
              type:
                type: string
                enum:
                - http
                - email
                - sns
                description: Type of destination (http, email, or sns)
              destinationTypeName:
                type: string
                enum:
                - ""
                - custom
                - openobserve
                - splunk
                - newrelic
                - elasticsearch
                - dynatrace
                - datadog
                description: Destination type name for pipeline destinations (only for http type)
              url:
                type: string
                description: URL endpoint for HTTP destinations
              method:
                type: string
                enum:
                - post
                - put
                - get
                default: post
                description: HTTP method for HTTP destinations
              headers:
                type: object
                additionalProperties:
                  type: string
                description: HTTP headers to include in the request
              metadata:
                type: object
                additionalProperties:
                  type: string
                description: Additional metadata for the destination
              skipTlsVerify:
                type: boolean
                default: false
                description: Whether to skip TLS certificate verification
              outputFormat:
                x-kubernetes-preserve-unknown-fields: true
                description: Output format for the destination (json, nestedevent, or elasticsearch bulk format)
              emails:
                type: array
                items:
                  type: string
                  format: email
                description: Email addresses for email destinations
              template:
                type: string
                description: Name of the alert template to use (for alert destinations)
              actionId:
                type: string
                description: Action ID for SNS destinations
              awsRegion:
                type: string
                description: AWS region for SNS destinations
              snsTopicArn:
                type: string
                description: SNS Topic ARN for SNS destinations
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      type: integer
                      format: int64
              organization:
                type: string
                description: Organization where the destination was created
              lastSyncTime:
                type: string
                format: date-time
              observedGeneration:
                type: integer
                format: int64
              destinationCategory:
                type: string
                enum:
                - alert
                - pipeline
                description: Automatically determined category based on type and destinationTypeName
              deletionRetryCount:
                type: integer
                description: Tracks the number of deletion attempts
    additionalPrinterColumns:
    - name: Type
      type: string
      jsonPath: .spec.type
    - name: Category
      type: string
      jsonPath: .status.destinationCategory
    - name: Destination-Type
      type: string
      jsonPath: .spec.destinationTypeName
    - name: Ready
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: functions.openobserve.ai
spec:
  group: openobserve.ai
  names:
    kind: Function
    listKind: FunctionList
    plural: functions
    singular: function
    shortNames:
    - o2function
    - o2func
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - configRef
            - name
            - function
            properties:
              configRef:
                type: object
                required:
                - name
                properties:
                  name:
                    type: string
                    description: Name of the OpenObserveConfig resource
                  namespace:
                    type: string
                    description: Namespace of the OpenObserveConfig resource (optional)
              name:
                type: string
                pattern: "^[a-zA-Z0-9_-]+$"
                description: Name of the function (must be unique within the organization)
              org:
                type: string
                description: Organization name to create the function in. If not specified, uses the organization from ConfigRef.
              function:
                type: string
                description: VRL function code to transform the data
              numArgs:
                type: integer
                format: int32
                default: 0
                description: Number of arguments the function accepts
              params:
                type: string
                default: "string"
                description: Parameters configuration for the function
              transType:
                type: integer
                format: int32
                default: 0
                description: Transformation type (0 for standard transformation)
              test:
                type: object
                description: Test configuration for the function (optional)
                properties:
                  enabled:
                    type: boolean
                    default: false
                    description: Whether to test the function before creating/updating
                  events:
                    type: array
                    description: Test events to validate the function
                    minItems: 1
                    items:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  required:
                  - type
                  - status
                  properties:
                    type:
                      type: string
                      description: Type of condition
                    status:
                      type: string
                      description: Status of the condition (True, False, Unknown)
                    observedGeneration:
                      type: integer
                      format: int64
                      description: Generation observed by the controller
                    lastTransitionTime:
                      type: string
                      format: date-time
                      description: Last time the condition changed
                    reason:
                      type: string
                      description: Reason for the condition change
                    message:
                      type: string
                      description: Human-readable message
              openobserveFunctionId:
                type: string
                description: Function ID in OpenObserve
              organization:
                type: string
                description: Organization where the function was created
              lastSyncTime:
                type: string
                format: date-time
                description: Last time the function was synced with OpenObserve
              observedGeneration:
                type: integer
                format: int64
                description: Generation observed by the controller
              dependencies:
                type: array
                description: List of dependencies for this function
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Dependency ID
                    name:
                      type: string
                      description: Dependency name
              testResults:
                type: object
                description: Results from the last test execution
                properties:
                  success:
                    type: boolean
                    description: Whether the test was successful
                  testedAt:
                    type: string
                    format: date-time
                    description: When the test was executed
                  message:
                    type: string
                    description: Test result message
              lastError:
                type: string
                description: Last error encountered during reconciliation
              deletionRetryCount:
                type: integer
                description: Tracks the number of deletion attempts
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Function
      type: string
      jsonPath: .spec.name
      priority: 0
    - name: Organization
      type: string
      jsonPath: .spec.org
      priority: 1
    - name: Ready
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
      priority: 0
    - name: Dependencies
      type: integer
      jsonPath: .status.dependencies[*]
      priority: 1
    - name: Test
      type: boolean
      jsonPath: .spec.test.enabled
      priority: 1
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
      priority: 0
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pipelines.openobserve.ai
spec:
  group: openobserve.ai
  names:
    kind: Pipeline
    listKind: PipelineList
    plural: pipelines
    singular: pipeline
    shortNames:
    - o2pipeline
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - configRef
            - name
            - source
            - nodes
            properties:
              configRef:
                type: object
                required:
                - name
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
              name:
                type: string
              description:
                type: string
              enabled:
                type: boolean
                default: true
              org:
                type: string
                description: Organization name
              pipeline_id:
                type: string
                description: Pipeline ID in OpenObserve
              version:
                type: integer
                format: int64
                description: Pipeline version
              source:
                type: object
                required:
                - streamType
                properties:
                  streamName:
                    type: string
                    description: Name of the source stream (optional for query-based sources)
                  streamType:
                    type: string
                    enum:
                    - logs
                    - metrics
                    - traces
                    default: logs
                  sourceType:
                    type: string
                    enum:
                    - realtime
                    - scheduled
                    default: realtime
                  orgId:
                    type: string
                    description: Organization ID for the source
                  tzOffset:
                    type: integer
                    description: Timezone offset in minutes
                  delay:
                    type: integer
                    description: Delay in seconds before processing
                  queryCondition:
                    type: object
                    description: Query condition for scheduled pipelines with query sources
                    properties:
                      type:
                        type: string
                        enum:
                        - custom
                        - sql
                        - promql
                        default: custom
                      sql:
                        type: string
                      promql:
                        type: string
                      promqlCondition:
                        type: object
                        properties:
                          column:
                            type: string
                          operator:
                            type: string
                          value:
                            type: number
                          ignoreCase:
                            type: boolean
                      conditions:
                        type: object
                      aggregation:
                        type: object
                      vrlFunction:
                        type: string
                      searchEventType:
                        type: string
                      multiTimeRange:
                        type: array
                        items:
                          type: object
                  triggerCondition:
                    type: object
                    description: Trigger condition for scheduled pipelines
                    properties:
                      frequency:
                        type: integer
                        minimum: 1
                        default: 1
                      frequencyType:
                        type: string
                        enum:
                        - minutes
                        - hours
                        - days
                        - cron
                        default: minutes
                      cron:
                        type: string
                      period:
                        type: integer
                        minimum: 0
                        default: 0
                      threshold:
                        type: integer
                        minimum: 0
                        default: 0
                      operator:
                        type: string
                        enum:
                        - "="
                        - "!="
                        - ">"
                        - ">="
                        - "<"
                        - "<="
                        - Contains
                        - NotContains
                        default: ">="
                      silence:
                        type: integer
                        minimum: 0
                        default: 0
                      timezone:
                        type: string
                        default: UTC
                      toleranceInSecs:
                        type: integer
                      alignTime:
                        type: boolean
              nodes:
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                  - id
                  - type
                  - name
                  properties:
                    id:
                      type: string
                    type:
                      type: string
                    name:
                      type: string
                    config:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
              edges:
                type: array
                items:
                  type: object
                  required:
                  - source
                  - target
                  properties:
                    source:
                      type: string
                    target:
                      type: string
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  required:
                  - type
                  - status
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    observedGeneration:
                      type: integer
                      format: int64
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
              openobservePipelineId:
                type: string
              organization:
                type: string
